    data = get_aktau_rates()
    df = pd.DataFrame(data)
    # Сохраняем с датой проверки
    today = datetime.now().strftime("%Y-%m-%d_%H-%M")
    df.to_csv(f"rates_aktau_{today}.csv", index=False)
    df.to_csv("rates_aktau_latest.csv", index=False)
    print(f"Сохранено {len(df)} банков, {today}")А чтобы проверка была ежедневной автоматически, создаем файл .github/workflows/daily.yml:yamlname: Daily Aktau Rates
